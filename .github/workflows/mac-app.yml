# 在 GitHub 的 macOS 构建机上做出独立的 DJ Studio.app（只做 Apple 芯片版，不做 Intel 版）：
#   1. 用 Mixxx 2.5.6 源码编声音引擎 djstudio-engine（只编这一个程序，见 tools/mixxx-engine）
#   2. 在 Apple 芯片的构建机上测引擎（冒烟 + 对时：分析看到的 = 实际放出来的，拍线落在 kick 上），
#      再用 PyInstaller 把网页服务（Python）和引擎打成一个 .app，自检
#   3. 放到 GitHub Release「mac-app-latest」（README 里的一行安装命令从这里下载）
# 失败时把日志传到 Release「ci-logs」。
name: mac-app
on:
  push:
    branches: [main, mac-app]
    paths:
      - "tools/mixxx-engine/**"
      - "packaging/**"
      - "djstudio/**"
      - "pyproject.toml"
      - ".github/workflows/mac-app.yml"
permissions:
  contents: write
concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true
env:
  MIXXX_TAG: "2.5.6"
  RELEASE_TAG: mac-app-latest

jobs:
  engine:
    name: engine-${{ matrix.arch }}
    # Mixxx 的 macOS 构建环境只支持 Intel 构建机；Apple 芯片版是交叉编译（和 Mixxx 官方 CI 一样）
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            buildenv: tools/macos_arm64-cross-release_buildenv.sh
            triplet: arm64-osx-min1100-release
    steps:
      - uses: actions/checkout@v4
      - name: 报到（ci-logs 里能看到构建开始了）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ci-logs --prerelease --title "CI logs" --notes "构建日志（自动上传）" 2>/dev/null || true
          echo "== $GITHUB_SHA engine-${{ matrix.arch }} started $(date -u)" > engine-${{ matrix.arch }}.log
          for i in 1 2 3 4 5 6; do gh release upload ci-logs engine-${{ matrix.arch }}.log --clobber && break; sleep 10; done
          # 整个任务期间每 3 分钟把进度（走到哪一步 + 编译输出的最后几行）传到 ci-logs：这边看不到 Actions 的日志
          echo "started $(date -u)" > "$RUNNER_TEMP/progress.txt"
          nohup bash -c 'while sleep 180; do { echo "== $GITHUB_SHA engine-${{ matrix.arch }} $(date -u)"; cat "$RUNNER_TEMP/progress.txt"; echo "-- 编译输出"; tail -n 40 "$GITHUB_WORKSPACE/engine-build.log" 2>/dev/null; } > "$RUNNER_TEMP/engine-${{ matrix.arch }}-progress.log"; gh release upload ci-logs "$RUNNER_TEMP/engine-${{ matrix.arch }}-progress.log" --clobber >/dev/null 2>&1; done' >/dev/null 2>&1 &
      - name: Mixxx 源码
        run: |
          echo "$(date -u +%H:%M:%S) Mixxx 源码" >> "$RUNNER_TEMP/progress.txt"
          git clone --depth 1 --branch "$MIXXX_TAG" https://github.com/mixxxdj/mixxx "$RUNNER_TEMP/mixxx"
      - uses: jwlawson/actions-setup-cmake@v2.2
        with:
          cmake-version: "3.21.x"
      - name: 工具
        run: |
          echo "$(date -u +%H:%M:%S) 工具" >> "$RUNNER_TEMP/progress.txt"
          brew install ccache ninja || true
      - name: Mixxx 的构建环境（预编译的依赖）
        working-directory: ${{ runner.temp }}/mixxx
        run: |
          echo "$(date -u +%H:%M:%S) Mixxx 的构建环境（预编译的依赖）" >> "$RUNNER_TEMP/progress.txt"
          ${{ matrix.buildenv }} setup
        env:
          BUILDENV_BASEPATH: /Users/runner/buildenv
      # 编译缓存：失败的构建也存下来（下一次只编改了的文件）
      - uses: actions/cache/restore@v4
        with:
          path: /Users/runner/Library/Caches/ccache
          key: engine-${{ matrix.arch }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: engine-${{ matrix.arch }}-
      - name: 编引擎
        env:
          GH_TOKEN: ${{ github.token }}
          CMAKE_ARGS_EXTRA: >-
            -DCOREAUDIO=ON -DQT6=ON -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: |
          echo "$(date -u +%H:%M:%S) 编引擎" >> "$RUNNER_TEMP/progress.txt"
          set -o pipefail
          ccache --max-size=2G
          tools/mixxx-engine/build.sh "$RUNNER_TEMP/mixxx" 2>&1 | tee engine-build.log
          ccache --show-stats
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /Users/runner/Library/Caches/ccache
          key: engine-${{ matrix.arch }}-${{ github.run_number }}-${{ github.run_attempt }}
      - name: 看引擎依赖哪些库（只应有系统自带的）
        run: |
          echo "$(date -u +%H:%M:%S) 看引擎依赖哪些库（只应有系统自带的）" >> "$RUNNER_TEMP/progress.txt"
          set -o pipefail
          F=tools/mixxx-engine/dist/djstudio-engine
          { lipo -info "$F"; ls -la "$F"; otool -L "$F"; } | tee engine-deps.txt
          if otool -L "$F" | tail -n +2 | grep -vE '^\s*(/usr/lib/|/System/)'; then echo "有非系统库"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.arch }}
          path: tools/mixxx-engine/dist
      - name: 上传日志（成功失败都传，Release「ci-logs」）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release create ci-logs --prerelease --title "CI logs" --notes "构建日志（自动上传）" 2>/dev/null || true
          { echo "== $GITHUB_SHA engine-${{ matrix.arch }} ${{ job.status }}"; cat engine-deps.txt 2>/dev/null || true; tail -n 800 engine-build.log 2>/dev/null || true; } > engine-${{ matrix.arch }}.log
          for i in 1 2 3 4 5 6; do gh release upload ci-logs engine-${{ matrix.arch }}.log --clobber && break; sleep 10; done

  app:
    name: app-${{ matrix.arch }}
    needs: engine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            # 在用户用的系统上打包和测试（用户的 Mac：macOS 26 Tahoe）：冒烟、对时、自检都在这个系统上跑。
            # 最低系统版本由下面「最低 macOS」一步把关，不能高于用户的系统
            os: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.arch }}
          path: tools/mixxx-engine/dist
      - run: chmod +x tools/mixxx-engine/dist/djstudio-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依赖
        run: |
          echo "COMMIT = \"${GITHUB_SHA}\"" > djstudio/_build.py
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: 引擎冒烟测试（Mac 的解码器、DJStudio.js、声卡时钟）
        run: |
          set -o pipefail
          python packaging/macos/smoke_engine.py tools/mixxx-engine/dist/djstudio-engine 2>&1 | tee engine-smoke.log
      - name: 对时检查（分析用的解码 = 实际播放；拍线落在 kick 起音上；曲子中间起播的定位）
        run: |
          set -o pipefail
          brew install lame || true  # 生成 320k、带封面的测试 mp3（Mac 上没有 mp3 编码器）
          python packaging/macos/timing_check.py tools/mixxx-engine/dist/djstudio-engine 2>&1 | tee timing.log
      - name: 打包 DJ Studio.app
        run: |
          set -o pipefail
          export DJSTUDIO_APP_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          pyinstaller --noconfirm packaging/macos/djstudio.spec 2>&1 | tee app-build.log
      - name: 最低 macOS（.app 里每个程序 / 库要求的系统版本，不能高于用户的 macOS 26）
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee minos.log
          import os, subprocess, sys
          LIMIT = (26, 0)  # 用户的 Mac：macOS 26 Tahoe
          worst = []
          for root, _, files in os.walk("dist/DJ Studio.app"):
              for f in files:
                  path = os.path.join(root, f)
                  if os.path.islink(path):
                      continue
                  with open(path, "rb") as fh:
                      magic = fh.read(4)
                  if magic not in (b"\xcf\xfa\xed\xfe", b"\xca\xfe\xba\xbe", b"\xce\xfa\xed\xfe"):
                      continue  # 不是 Mach-O
                  # 只读最低系统版本：LC_BUILD_VERSION 的 minos、老格式 LC_VERSION_MIN_MACOSX 的 version。
                  # （LC_BUILD_VERSION 里 tool 下面也有一行 version，那是链接器的版本，不算）
                  vers, cmd = [], ""
                  for line in subprocess.run(["vtool", "-show-build", path], capture_output=True, text=True).stdout.splitlines():
                      w = line.split()
                      if len(w) < 2:
                          continue
                      if w[0] == "cmd":
                          cmd = w[1]
                      elif (cmd == "LC_BUILD_VERSION" and w[0] == "minos") or (cmd == "LC_VERSION_MIN_MACOSX" and w[0] == "version"):
                          vers.append(w[1])
                  for v in vers:
                      try:
                          t = tuple(int(x) for x in v.split(".")[:2])
                      except ValueError:
                          continue
                      worst.append((t, v, os.path.relpath(path, "dist")))
          worst.sort()
          for t, v, path in worst[-5:]:
              print(f"{v:>6}  {path}")
          top = worst[-1] if worst else None
          print(f"最低 macOS：{top[1] if top else '?'}（{len(worst)} 个程序 / 库）")
          if top and top[0] > LIMIT:
              sys.exit(f"有程序要求 macOS {top[1]}，高于 {LIMIT[0]}.{LIMIT[1]}：用户的 Mac 打不开")
          PY
      - name: 自检（在 .app 里：引擎、解码、声音输出）
        run: |
          set -o pipefail
          "dist/DJ Studio.app/Contents/MacOS/DJ Studio" selftest 2>&1 | tee selftest-${{ matrix.arch }}.txt
      - name: 签名（ad-hoc）并压缩
        run: |
          codesign --force --deep --sign - "dist/DJ Studio.app"
          codesign --verify --deep --strict "dist/DJ Studio.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/DJ Studio.app" DJ-Studio-mac-${{ matrix.arch }}.zip
          ls -la DJ-Studio-mac-${{ matrix.arch }}.zip
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          gh release create "$RELEASE_TAG" --title "DJ Studio ${VER}（Mac，Apple 芯片）" --notes "独立的 DJ Studio.app" 2>/dev/null || true
          # 不再做 Intel 版：把以前传的删掉
          gh release delete-asset "$RELEASE_TAG" DJ-Studio-mac-x64.zip -y 2>/dev/null || true
          gh release delete-asset "$RELEASE_TAG" selftest-x64.txt -y 2>/dev/null || true
          for i in 1 2 3 4 5 6; do gh release upload "$RELEASE_TAG" DJ-Studio-mac-${{ matrix.arch }}.zip selftest-${{ matrix.arch }}.txt --clobber && break; sleep 10; done
          # 传好以后再改标题和说明：Release 页上看得到现在是哪一版
          {
            echo "独立的 DJ Studio.app，Apple 芯片（M1 及以后）的 Mac。当前版本 **$VER · ${GITHUB_SHA::7}**。"
            echo
            echo "安装 / 更新（终端里粘贴这一行，装进「应用程序」并打开）："
            echo
            echo '```bash'
            echo 'curl -fL -o /tmp/djstudio.zip "https://github.com/bg1eym/dj-studio/releases/download/mac-app-latest/DJ-Studio-mac-arm64.zip" && rm -rf "/Applications/DJ Studio.app" && ditto -x -k /tmp/djstudio.zip /Applications && open "/Applications/DJ Studio.app"'
            echo '```'
          } > release-notes.md
          gh release edit "$RELEASE_TAG" --title "DJ Studio ${VER}（Mac，Apple 芯片）" --notes-file release-notes.md --prerelease=false --latest || true
      - name: 上传日志（成功失败都传，Release「ci-logs」）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release create ci-logs --prerelease --title "CI logs" --notes "构建日志（自动上传）" 2>/dev/null || true
          { echo "== $GITHUB_SHA app-${{ matrix.arch }} ${{ job.status }}"; cat engine-smoke.log timing.log minos.log selftest-${{ matrix.arch }}.txt 2>/dev/null || true; tail -n 400 app-build.log 2>/dev/null || true; } > app-${{ matrix.arch }}.log
          for i in 1 2 3 4 5 6; do gh release upload ci-logs app-${{ matrix.arch }}.log --clobber && break; sleep 10; done
