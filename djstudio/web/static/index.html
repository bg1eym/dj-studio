<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Studio</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#home">DJ Studio</a>
    <nav id="tabs" class="hidden">
      <a href="#home" data-tab="home">← 回首页</a>
      <a href="#show" data-tab="show">控制台</a>
      <a href="#library" data-tab="library">曲库</a>
      <a href="#sets" data-tab="sets">Set</a>
      <a href="#doctor" data-tab="doctor">体检</a>
    </nav>
    <span class="grow"></span>
    <div class="engine" id="engine-badge" title="引擎状态"><span class="dot"></span><span class="txt">Mixxx 未连接</span></div>
    <span class="ver" id="ver"></span>
    <a href="#show" id="adv-link" class="adv-link">高级</a>
    <a href="#" id="quit-link" class="adv-link" title="退出 DJ Studio（停掉演出、关掉声音引擎）">退出</a>
  </header>
  <div id="alarm" class="alarm hidden"></div>
  <main>
    <section id="tab-home" class="tab"></section>
    <section id="tab-library" class="tab"></section>
    <section id="tab-sets" class="tab"></section>
    <section id="tab-show" class="tab"></section>
    <section id="tab-doctor" class="tab"></section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
